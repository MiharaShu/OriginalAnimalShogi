<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ポケ丸制作のオリジナルどうぶつ将棋。チュートリアル、対人戦、AI対戦、ストーリーモードを無料で遊べます。">
    <meta name="theme-color" content="#56ab2f">
    <meta http-equiv="refresh" content="0; url=Unity/src/DoubutuShogi.html">
    <link rel="icon" href="Unity/assets/images/lion.webp" type="image/webp">
    <title>オリジナルどうぶつ将棋 - 起動中</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: #1a1a2e;
            font-family: "Segoe UI", "Meiryo", sans-serif;
            color: #eee;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, 0.15);
            border-top-color: #a8e063;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #a8e063; }
        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }
    </style>
</head>
<body>
    <div class="spinner" aria-hidden="true"></div>
    <p>ゲームを読み込んでいます…</p>
    <p>
        自動で起動しない場合は
        <a href="Unity/src/DoubutuShogi.html">ゲームを開く</a>
    </p>
</body>
</html>
